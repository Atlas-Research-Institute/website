<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy policy — Atlas Research Institute</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://atlas-research.org/privacy" />
    <meta http-equiv="refresh" content="0; url=/privacy" />
    <!--
      THIS PAGE IS DELIBERATELY KEPT, NOT DELETED.

      The privacy policy now lives in the app at /privacy
      (src/pages/Privacy.tsx). This file remains only because older links and
      emails point at /privacy.html, and removing it would 404 them.

      Its previous contents were a standalone styled page whose text had gone
      stale — it described a waitlist that collected only an email, a 12-month
      retention window, and a "youth-led" organisation. Anything still accurate
      was carried into src/pages/Privacy.tsx; the rest was wrong and is gone.

      Redirect belt and braces: a meta refresh for crawlers plus a script
      replace() so the stale URL does not sit in browser history.
    -->
    <script>
      window.location.replace("/privacy");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #57575c;
        font-family: 'Source Serif 4', Georgia, serif;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #0e0e10;
      }
    </style>
  </head>
  <body>
    <p>
      This page has moved to <a href="/privacy">/privacy</a>.
    </p>
  </body>
</html>
